<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">FinanceMe 系統架構</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#64748b">個人財務管理應用：股票 CRUD 接後端，儀表板為靜態展示，外幣 / 貸款頁面開發中</text>

  <!-- Browser -->
  <rect x="60" y="130" width="180" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">瀏覽器</text>
  <text x="150" y="186" text-anchor="middle" font-size="12" fill="#334155">四個頁面路由：</text>
  <text x="150" y="206" text-anchor="middle" font-size="12" fill="#334155">/ 儀表板（靜態卡片）</text>
  <text x="150" y="224" text-anchor="middle" font-size="12" fill="#334155">/stocks 股票（完整 CRUD）</text>
  <text x="150" y="242" text-anchor="middle" font-size="12" fill="#334155">/foreign-currency 開發中</text>
  <text x="150" y="260" text-anchor="middle" font-size="12" fill="#334155">/loans 開發中</text>

  <!-- Frontend -->
  <rect x="330" y="130" width="200" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Frontend</text>
  <text x="430" y="186" text-anchor="middle" font-size="12" fill="#334155">React 19 + TypeScript</text>
  <text x="430" y="206" text-anchor="middle" font-size="12" fill="#334155">Vite 7 dev server</text>
  <text x="430" y="226" text-anchor="middle" font-size="12" fill="#334155">axios 呼叫 /api/*</text>
  <text x="430" y="246" text-anchor="middle" font-size="12" fill="#334155">Vite proxy → :3000</text>

  <!-- Backend -->
  <rect x="620" y="130" width="200" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Backend</text>
  <text x="720" y="186" text-anchor="middle" font-size="12" fill="#334155">Express 4 + TypeScript</text>
  <text x="720" y="206" text-anchor="middle" font-size="12" fill="#334155">port 3000（或 PORT env）</text>
  <text x="720" y="226" text-anchor="middle" font-size="12" fill="#334155">REST: GET/POST/PUT/DELETE</text>
  <text x="720" y="246" text-anchor="middle" font-size="12" fill="#334155">/api/stocks</text>

  <!-- Arrows -->
  <line x1="245" y1="205" x2="322" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="205" x2="612" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <rect x="620" y="330" width="200" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">SQLite</text>
  <text x="720" y="388" text-anchor="middle" font-size="12" fill="#334155">backend/finances.db</text>
  <text x="720" y="408" text-anchor="middle" font-size="12" fill="#334155">啟動時自動建立</text>
  <text x="720" y="428" text-anchor="middle" font-size="12" fill="#334155">table: stocks（唯一）</text>
  <line x1="720" y1="285" x2="720" y2="322" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="308" font-size="11" fill="#64748b">SQL</text>

  <!-- Legend: data flow -->
  <rect x="60" y="330" width="470" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="362" font-size="15" font-weight="700" fill="#0f172a">資料流向</text>
  <text x="84" y="390" font-size="12" fill="#334155">1. 股票頁：React dataService（axios）→ Vite proxy /api → Express → SQLite</text>
  <text x="84" y="412" font-size="12" fill="#334155">2. 後端計算 currentValue（現價 × 股數）與 profitLoss（損益），寫入 DB</text>
  <text x="84" y="434" font-size="12" fill="#334155">3. 儀表板目前為靜態展示卡片；外幣 / 貸款頁面為「即將推出」佔位</text>

  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">手繪架構示意圖（以程式碼為準）</text>
</svg>
